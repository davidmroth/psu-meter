services:
  psu-meter:
    build:
      context: .
      dockerfile: Dockerfile
    image: psu-meter:latest
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - LOG_LEVEL=DEBUG
      - PSU_PARSE_MODE=be-first
    # Map USB bus so hidapi inside container can access the device. If this
    # doesn't work on your system you may need to run the container with
    # --privileged or bind specific /dev entries instead.
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/data || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
